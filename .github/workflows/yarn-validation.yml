name: Yarn validation
env:
  YARN_ENABLE_HARDENED_MODE: 1
on:
  pull_request:
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yarn-validation.yml'
      - '.github/actions/changed-paths/**'
      - 'scripts/disallow-non-exact.js'
      - '**/package.json'
      - '**/yarn.lock'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths (Yarn validation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      affected: ${{ steps.changed-paths.outputs.affected }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Match changed paths
        id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          workflow: Yarn validation
          paths: |
            - '.github/workflows/yarn-validation.yml'
            - '.github/actions/changed-paths/**'
            - 'scripts/disallow-non-exact.js'
            - '**/package.json'
            - '**/yarn.lock'

  yarn-validation:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true') && github.repository == 'software-mansion/react-native-reanimated' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020

      - name: Check if all versions are exact
        working-directory: ${{ github.workspace }}
        run: node ./scripts/disallow-non-exact.js

      - name: Install monorepo dependencies
        run: yarn install --immutable

      - name: Check for dependency duplication
        run: yarn dedupe --check
