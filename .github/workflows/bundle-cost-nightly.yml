name: Bundle cost nightly
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-matrix:
    if: github.repository == 'software-mansion/react-native-reanimated'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-outputs.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          sparse-checkout: |
            /.nvmrc
            /.github/workflows/helper
            /packages/react-native-reanimated/compatibility.json
            /packages/react-native-worklets/compatibility.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Resolve versions to measure
        run: node --experimental-strip-types .github/workflows/helper/read-bundle-cost-matrix.ts

      - name: Set outputs
        id: set-outputs
        run: echo "matrix=$(cat /tmp/bundle-cost-matrix.json)" >> "$GITHUB_OUTPUT"

  measure:
    if: github.repository == 'software-mansion/react-native-reanimated'
    runs-on: ubuntu-latest
    needs: read-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read-matrix.outputs.matrix) }}
    env:
      APP_DIR: apps/fabric-example
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Set up the requested bundle mode
        run: |
          if grep -q 'bundleMode: true' "${APP_DIR}/babel.config.js"; then
            committed=true
          else
            committed=false
          fi
          echo "committed bundle mode: ${committed}, this job measures: ${{ matrix.bundleMode }}"
          if [ "${committed}" = "${{ matrix.bundleMode }}" ]; then
            yarn install --immutable
          else
            # Toggling runs its own install, so no separate one is needed.
            bash scripts/toggle-bundle-mode.sh
          fi

      - name: Resolve Reanimated and Worklets from the app
        run: node --experimental-strip-types .github/workflows/helper/use-app-local-reanimated.ts

      - name: Install released Reanimated and Worklets
        run: |
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn workspace fabric-example add \
            "react-native-reanimated@${{ matrix.reanimatedVersion }}" \
            "react-native-worklets@${{ matrix.workletsVersion }}"

      - name: Report what is actually installed
        run: |
          node -e "console.log('reanimated', require('./${APP_DIR}/node_modules/react-native-reanimated/package.json').version)"
          node -e "console.log('worklets', require('./${APP_DIR}/node_modules/react-native-worklets/package.json').version)"

      - name: Measure bundle cost
        run: |
          node scripts/measure-bundle-cost.mts \
            --platform=ios,android \
            --bundle-mode=${{ matrix.bundleMode }} \
            --json > /tmp/raw.json
          cat /tmp/raw.json

      - name: Attach version metadata
        run: |
          mkdir -p /tmp/bundle-cost-results
          jq \
            --arg reanimated "${{ matrix.reanimatedVersion }}" \
            --arg worklets "${{ matrix.workletsVersion }}" \
            --arg reactNative "${{ matrix.reactNativeVersion }}" \
            --argjson bundleMode ${{ matrix.bundleMode }} \
            'del(.mode) as $results | {
               reanimatedVersion: $reanimated,
               workletsVersion: $worklets,
               reactNativeVersion: $reactNative,
               bundleMode: $bundleMode,
               results: $results
             }' /tmp/raw.json > "/tmp/bundle-cost-results/${{ matrix.reanimatedVersion }}-bundle-mode-${{ matrix.bundleMode }}.json"

      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-cost-${{ matrix.reanimatedVersion }}-bundle-mode-${{ matrix.bundleMode }}
          path: /tmp/bundle-cost-results/*.json

  notify:
    if: ${{ always() && github.repository == 'software-mansion/react-native-reanimated' }}
    runs-on: ubuntu-latest
    needs: measure
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          sparse-checkout: |
            /.nvmrc
            /.github/workflows/helper
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Download results
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          path: /tmp/bundle-cost-results
          pattern: bundle-cost-*
        continue-on-error: true

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types .github/workflows/helper/bundle-cost-notification.ts /tmp/bundle-cost-results
