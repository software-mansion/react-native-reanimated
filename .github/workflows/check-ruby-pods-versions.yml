name: Check Ruby and CocoaPods versions
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Check Ruby and CocoaPods versions
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changed-paths.yml
    with:
      workflow: Check Ruby and CocoaPods versions
      paths: |
        - '.github/workflows/check-ruby-pods-versions.yml'
        - '.github/workflows/changed-paths.yml'
        - 'apps/**/Gemfile.lock'
        - 'apps/**/**/Podfile.lock'

  ruby-pods-version-check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true') && github.repository == 'software-mansion/react-native-reanimated' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # TODO: bring back macos-example once they update to RN 0.83
        working-directory: [fabric-example, tvos-example]
    concurrency:
      group: ruby-pods-version-check-${{ matrix.working-directory }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Clear annotations
        run: .github/workflows/helper/clear-annotations.sh

      - name: Verify Ruby and CocoaPods versions in lockfiles
        run: .github/workflows/helper/check-ruby-pods.sh "apps/${{ matrix.working-directory }}"
