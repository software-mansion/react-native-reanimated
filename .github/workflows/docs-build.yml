name: docs build
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths (docs build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      affected: ${{ steps.changed-paths.outputs.affected }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Match changed paths
        id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          workflow: docs build
          paths: |
            - '.github/workflows/docs-build.yml'
            - '.github/workflows/docs-publish.yml'
            - '.github/actions/docs-build/**'
            - '.github/actions/changed-paths/**'
            - 'scripts/validate-docs-versions.js'
            - 'docs/docs-reanimated/**'
            - 'packages/react-native-reanimated/compatibility.json'
            - 'docs/docs-worklets/**'
            - 'packages/react-native-worklets/compatibility.json'

  docs-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    env:
      REANIMATED_DOCS_DIR: docs/docs-reanimated
      WORKLETS_DOCS_DIR: docs/docs-worklets
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install monorepo node dependencies
        run: yarn install

      # We always build both docs because they are released together.
      - name: Lint and build Reanimated and Worklets docs
        uses: ./.github/actions/docs-build
        with:
          REANIMATED_DOCS_DIR: ${{ env.REANIMATED_DOCS_DIR }}
          WORKLETS_DOCS_DIR: ${{ env.WORKLETS_DOCS_DIR }}
