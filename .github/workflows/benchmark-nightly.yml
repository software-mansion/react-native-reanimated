name: Benchmark nightly
on:
  schedule:
    # 01:17 UTC — offset from other nightly crons to spread runner load
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    if: github.repository == 'software-mansion/react-native-reanimated' && vars.BENCHMARK_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - name: Read the latest stable Reanimated version
        id: latest
        run: echo "version=$(npm view react-native-reanimated@latest version)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: latest-release
    if: github.repository == 'software-mansion/react-native-reanimated' && vars.BENCHMARK_NIGHTLY_ENABLED == 'true'
    uses: $/.github/workflows/benchmark-run.yml
    with:
      platform: ${{ vars.BENCHMARK_NIGHTLY_PLATFORM }}
      phone: ${{ vars.BENCHMARK_NIGHTLY_PHONE }}
      a-reanimated: ${{ needs.latest-release.outputs.version }}
      b-reanimated: main
      scenarios: all
      noise-limits: ${{ vars.BENCHMARK_NIGHTLY_NOISE_LIMITS }}
