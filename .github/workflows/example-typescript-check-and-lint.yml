name: Example Typescript check and lint
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  pull_request:
  merge_group:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Example Typescript check and lint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changed-paths.yml
    with:
      workflow: Example Typescript check and lint
      paths: |
        - '.github/workflows/example-typescript-check-and-lint.yml'
        - '.github/workflows/changed-paths.yml'
        - 'packages/react-native-reanimated/src/**'
        - 'packages/react-native-reanimated/package.json'
        - 'packages/react-native-worklets/src/**'
        - 'packages/react-native-worklets/package.json'
        - '**/tsconfig*.json'
        - 'eslint.config.mjs'
        - 'yarn.lock'
        - 'apps/common-app/**'
        - 'apps/tvos-example/**'
        - 'apps/fabric-example/**'
        # TODO: fix macos-example
        # - 'apps/macos-example/**'
        # next-example does not have type:check yet
        # - 'apps/next-example/**'
        # web-example uses a hack in tsconfig, it will fail the CI
        # - 'apps/web-example/**'

  build-packages:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.affected == 'true') && github.repository == 'software-mansion/react-native-reanimated' }}
    runs-on: ubuntu-latest
    concurrency:
      group: typescript-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: 'yarn'
      - name: Install monorepo node dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Upload package build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-build
          path: |
            packages/react-native-reanimated/lib
            packages/react-native-worklets/lib
            packages/react-native-worklets/plugin/index.js
            packages/react-native-worklets/plugin/index.js.map
            packages/react-native-worklets/plugin/index.d.ts
          retention-days: 1
          if-no-files-found: error

  example-typescript-check-and-lint:
    needs: [changes, build-packages]
    if: ${{ !cancelled() && needs.build-packages.result == 'success' && github.repository == 'software-mansion/react-native-reanimated' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Static so every leg reports a stable check name (and a "skipped"
        # conclusion when unaffected), which is what lets it be required.
        working-directory:
          [apps/common-app, apps/tvos-example, apps/fabric-example]
    concurrency:
      group: typescript-${{ matrix.working-directory }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: 'yarn'
      - name: Clear annotations
        run: .github/workflows/helper/clear-annotations.sh
      - name: Install monorepo node dependencies
        run: yarn install --immutable
      - name: Download package build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages-build
          path: packages
      - name: Check types
        working-directory: ${{ matrix.working-directory }}
        run: yarn type:check
      - name: Lint
        working-directory: ${{ matrix.working-directory }}
        run: yarn lint

  example-web-build:
    needs: [changes, build-packages]
    if: ${{ !cancelled() && needs.build-packages.result == 'success' && github.repository == 'software-mansion/react-native-reanimated' }}
    runs-on: ubuntu-latest
    concurrency:
      group: typescript-web-example-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: 'yarn'
      - name: Install monorepo node dependencies
        run: yarn install --immutable
      - name: Download package build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packages-build
          path: packages
      - name: Build WebExample
        working-directory: apps/web-example
        run: yarn build
