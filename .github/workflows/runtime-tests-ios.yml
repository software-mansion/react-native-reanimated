name: Runtime tests iOS
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  pull_request:
    paths:
      - .github/workflows/runtime-tests-ios.yml
  workflow_call:
    inputs:
      bundleMode:
        required: false
        type: boolean
        default: false
      configuration:
        required: false
        type: string
        default: DebugRuntimeTests
      sanitizer:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      bundleMode:
        required: false
        type: boolean
        default: false
      configuration:
        required: false
        type: string
        default: DebugRuntimeTests
      sanitizer:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  runtime-tests-ios:
    if: github.repository == 'software-mansion/react-native-reanimated'
    name: ${{ matrix.bundleMode && 'Bundle Mode' || 'Legacy Eval' }}
    runs-on: macos-26
    timeout-minutes: ${{ inputs.sanitizer && 240 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        bundleMode: ${{ fromJSON((github.event_name == 'pull_request' && github.workflow == 'Runtime tests iOS') && '[false, true]' || format('[{0}]', inputs.bundleMode)) }}
    env:
      WORKING_DIRECTORY: apps/fabric-example
      REANIMATED_DIR: packages/react-native-reanimated
      CONFIGURATION: ${{ inputs.configuration || 'DebugRuntimeTests' }}
      SANITIZER_FLAG: ${{ inputs.sanitizer && format('--sanitizer {0}', inputs.sanitizer) || '' }}
      SANITIZER_SKIP_BUILD_FLAG: ${{ inputs.sanitizer && '--skip-build' || '' }}
    concurrency:
      group: runtime-tests-ios-${{ github.ref }}-${{ matrix.bundleMode }}-${{ inputs.configuration || 'DebugRuntimeTests' }}-${{ inputs.sanitizer }}
      cancel-in-progress: true
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          bundler-cache: true

      - name: Install monorepo node dependencies
        run: yarn install --immutable

      - name: Toggle Bundle Mode off (Legacy Eval)
        if: ${{ !matrix.bundleMode }}
        run: yarn toggle-bundle-mode

      - name: Build Reanimated package
        working-directory: ${{ env.REANIMATED_DIR }}
        run: yarn build

      - name: Install Pods (with caching)
        if: ${{ !inputs.sanitizer }}
        uses: ./.github/actions/install-pods
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          pod-directory: ios

      # Sanitizers need React Native built from source, and the resulting Pods
      # and DerivedData must not overwrite the caches the regular legs share.
      - name: Install Pods from source (sanitizer)
        if: ${{ inputs.sanitizer }}
        working-directory: ${{ env.WORKING_DIRECTORY }}/ios
        run: |
          bundle install
          RCT_USE_PREBUILT_RNCORE=0 RCT_USE_RN_DEP=0 bundle exec pod update --no-repo-update

      - name: Cache DerivedData
        if: ${{ !inputs.sanitizer }}
        uses: ./.github/actions/cache-derived-data
        with:
          platform: ios
          working-directory: ${{ env.WORKING_DIRECTORY }}
          pod-directory: ios

      # The sanitizer test steps are advisory, so the build has to be its own
      # hard-failing step or a broken build would be swallowed with them.
      - name: Build app (sanitizer)
        if: ${{ inputs.sanitizer }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: node scripts/runtime-tests-server.js --build-only --configuration "$CONFIGURATION" $SANITIZER_FLAG

      - name: Run ReJest self-tests (builds the app, retries once)
        id: self-tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >-
          node scripts/runtime-tests-server.js --launch --library self-tests
          --configuration "$CONFIGURATION" $SANITIZER_SKIP_BUILD_FLAG --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG
          || node scripts/runtime-tests-server.js --launch --library self-tests
          --configuration "$CONFIGURATION" --skip-build --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG

      - name: Verify CI catches failing tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >-
          if node scripts/runtime-tests-server.js --launch --library self-tests
          --configuration "$CONFIGURATION" --skip-build --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG
          --only "intentional failures";
          then echo "A failing suite did not fail the runner" && exit 1;
          else echo "Failing tests correctly failed the runner"; fi

      - name: Run Worklets runtime tests (reuses the build, retries once)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >-
          node scripts/runtime-tests-server.js --launch --library worklets
          --configuration "$CONFIGURATION" --skip-build --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG
          || node scripts/runtime-tests-server.js --launch --library worklets
          --configuration "$CONFIGURATION" --skip-build --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG

      - name: Run Reanimated runtime tests (reuses the build, retries once)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >-
          node scripts/runtime-tests-server.js --launch --library reanimated
          --configuration "$CONFIGURATION" --skip-build --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG
          || node scripts/runtime-tests-server.js --launch --library reanimated
          --configuration "$CONFIGURATION" --skip-build --connect-timeout 900 --idle-timeout 900 $SANITIZER_FLAG

      # With halt_on_error=0 a detected race does not fail the tests that
      # triggered it, so the collected reports have to fail the job here.
      - name: Fail on sanitizer reports
        if: ${{ always() && inputs.sanitizer != '' }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          shopt -s nullglob
          reports=(sanitizer-reports/*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No sanitizer reports."
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
          echo "::error::The ${{ inputs.sanitizer }} sanitizer produced ${#reports[@]} report file(s), printed above."
          exit 1
