name: Remote runtime tests iOS
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  workflow_call:
    secrets:
      SIM_ROUTER_USERNAME:
        required: true
      SIM_ROUTER_API_KEY:
        required: true
    inputs:
      configuration:
        required: false
        type: string
        default: ReleaseRuntimeTests
      udid:
        required: false
        type: string
        default: ''
      full:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration (Debug* legs serve JS from Metro on the test runner)
        required: false
        type: string
        default: ReleaseRuntimeTests
      udid:
        description: Remote simulator UUID (blank = first available iPhone)
        required: false
        type: string
        default: ''
      full:
        description: Run the long variants and every suite, as the nightly does
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  # Check if we have all must-have credentials before running the workflow.
  preflight:
    if: github.repository == 'software-mansion/react-native-reanimated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_USERNAME: ${{ secrets.SIM_ROUTER_USERNAME != '' }}
      HAS_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY != '' }}
    steps:
      - name: Check cloud credentials are configured
        run: |
          if [ "$HAS_USERNAME" != "true" ] || [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::SIM_ROUTER_USERNAME and/or SIM_ROUTER_API_KEY secrets are not set — configure them in the repo settings before running this workflow"
            exit 1
          fi

  # Build on macos runner
  build-app:
    needs: preflight
    name: Build app (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      group: runtime-tests-ios-argent-${{ github.workflow }}-${{ github.ref }}-${{ matrix.configuration }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(format('["{0}"]', inputs.configuration || 'ReleaseRuntimeTests')) }}
    env:
      WORKING_DIRECTORY: apps/fabric-example
      CONFIGURATION: ${{ matrix.configuration }}
      USE_CCACHE_LAUNCHER: 1
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Read the Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore packaged app from cache
        id: appcache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: apps/fabric-example/dist/FabricExample.app.zip
          key:
            runtime-tests-app-zip-${{ env.CONFIGURATION }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles(
            'yarn.lock',
            '.nvmrc',
            '.ruby-version',
            'scripts/llvm-tools/**',
            'apps/fabric-example/**',
            'apps/common-app/**',
            'packages/react-native-reanimated/**',
            'packages/react-native-worklets/**'
            ) }}

      - name: Use Ruby version from `.ruby-version` file
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde
        with:
          bundler-cache: true

      - name: Use Node.js
        if: steps.appcache.outputs.cache-hit != 'true'
        id: setup-node
        uses: $/.github/actions/setup-node-yarn
        with:
          node-version-file: '.nvmrc'

      - name: Install monorepo node dependencies
        if: steps.appcache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: $/.github/actions/save-yarn-cache
        with:
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          cache-primary-key: ${{ steps.setup-node.outputs.cache-primary-key }}
          cache-path: ${{ steps.setup-node.outputs.cache-path }}

      - name: Build Reanimated package
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: packages/react-native-reanimated
        run: yarn build

      - name: Setup ccache
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: $/.github/actions/setup-ccache
        with:
          key-prefix: fabric-example-ios-${{ env.CONFIGURATION }}
          needs-compile-database: 'false'

      - name: Install Pods
        if: steps.appcache.outputs.cache-hit != 'true'
        id: install-pods
        uses: $/.github/actions/install-pods
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          pod-directory: ios

      - name: Build runtime-tests app
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: node --experimental-strip-types scripts/runtime-tests-server.mts --build-only --configuration "$CONFIGURATION"

      - name: Save ccache
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: $/.github/actions/save-ccache
        with:
          key-prefix: fabric-example-ios-${{ env.CONFIGURATION }}

      # Pods do not depend on the configuration; one leg of the nightly
      # fan-out saves.
      - name: Save Pods cache
        if: steps.appcache.outputs.cache-hit != 'true' && env.CONFIGURATION == 'Debug'
        uses: $/.github/actions/save-pods
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          pod-directory: ios
          cache-hit: ${{ steps.install-pods.outputs.cache-hit }}
          cache-primary-key: ${{ steps.install-pods.outputs.cache-primary-key }}

      - name: Package app artifact
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # Debug apps are deliberately Metro-fed here (the test job runs
          # Metro and tunnels it) — override the export script's guard.
          EXPORT_FLAGS=""
          case "$CONFIGURATION" in
            Debug*) EXPORT_FLAGS="--allow-debug" ;;
          esac
          node --experimental-strip-types scripts/export-runtime-tests-app.mts --configuration "$CONFIGURATION" --out dist/FabricExample.app.zip $EXPORT_FLAGS

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-tests-app-remote-${{ env.CONFIGURATION }}
          path: apps/fabric-example/dist/FabricExample.app.zip
          if-no-files-found: error
          retention-days: 3

  # Test on remote simulator running on Argent Cloud
  run-tests-remote:
    needs: build-app
    name: Remote tests (${{ matrix.configuration }})
    runs-on: ubuntu-latest # <- the whole point: no macOS, no local simulator
    timeout-minutes: 60
    concurrency:
      group: runtime-tests-ios-argent-${{ github.workflow }}-${{ github.ref }}-${{ matrix.configuration }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Must mirror build-app's matrix exactly.
        configuration: ${{ fromJSON(format('["{0}"]', inputs.configuration || 'ReleaseRuntimeTests')) }}
    env:
      WORKING_DIRECTORY: apps/fabric-example
      CONFIGURATION: ${{ matrix.configuration }}
      SIM_ROUTER_USERNAME: ${{ secrets.SIM_ROUTER_USERNAME }}
      SIM_ROUTER_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Use Node.js
        id: setup-node
        uses: $/.github/actions/setup-node-yarn
        with:
          node-version-file: '.nvmrc'

      - name: Install monorepo node dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        uses: $/.github/actions/save-yarn-cache
        with:
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          cache-primary-key: ${{ steps.setup-node.outputs.cache-primary-key }}
          cache-path: ${{ steps.setup-node.outputs.cache-path }}

      - name: Install sim-remote CLI
        uses: $/.github/actions/install-sim-remote

      - name: Log in and acquire a cloud machine
        shell: bash
        run: |
          # --timeout is the queue: when all pool machines are busy (e.g.
          # sibling matrix legs hold them), this leg waits up to 30 min for
          # a free one instead of failing after the default 120 s.
          sim-remote login --timeout 1800
          sim-remote simctl list devices --json | jq -e '.devices' > /dev/null
          echo "logged in, machine acquired"

      - name: Download app artifact
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          name: runtime-tests-app-remote-${{ env.CONFIGURATION }}
          path: apps/fabric-example/dist

      - name: Unpack app artifact
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          # unzip (not ditto — this is Linux); the zip was created with
          # ditto --keepParent so it unpacks to unpacked/FabricExample.app

          unzip -q dist/FabricExample.app.zip -d dist/unpacked

      - name: Pick remote simulator and install app
        id: sim
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          INPUT_UDID: ${{ inputs.udid }}
        run: |
          # Device-pick logic lives in the driver (`pick` subcommand) so it
          # is testable and reusable outside CI.
          if [ -n "$INPUT_UDID" ]; then
            UDID=$(node --experimental-strip-types scripts/runtime-tests-remote.mts pick --udid "$INPUT_UDID")
          else
            UDID=$(node --experimental-strip-types scripts/runtime-tests-remote.mts pick)
          fi

          echo "using remote simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          node --experimental-strip-types scripts/runtime-tests-remote.mts install --udid "$UDID" \
            --app-path dist/unpacked/FabricExample.app

      - name: Run ReJest self-tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          node --experimental-strip-types scripts/runtime-tests-remote.mts run --udid "${{ steps.sim.outputs.udid }}"
          --library self-tests --configuration "$CONFIGURATION"

      - name: Verify CI catches failing tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if RUNTIME_TESTS_CI_REPORT=0 node --experimental-strip-types scripts/runtime-tests-remote.mts run --udid "${{ steps.sim.outputs.udid }}" \
            --library self-tests --configuration "$CONFIGURATION" \
            --only "intentional failures";
          then
            echo "A failing suite did not fail the runner" && exit 1
          else
            echo "Failing tests correctly failed the runner"
          fi

      - name: Run Worklets runtime tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          node --experimental-strip-types scripts/runtime-tests-remote.mts run --udid "${{ steps.sim.outputs.udid }}"
          --library worklets --configuration "$CONFIGURATION" ${{ inputs.full && '--full true' || '' }}

      - name: Run Reanimated runtime tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          node --experimental-strip-types scripts/runtime-tests-remote.mts run --udid "${{ steps.sim.outputs.udid }}"
          --library reanimated --configuration "$CONFIGURATION" ${{ inputs.full && '--full true' || '' }}

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-remote-crash-reports-${{ env.CONFIGURATION }}
          path: apps/fabric-example/crash-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Release remote simulator
        if: always()
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          UDID="${{ steps.sim.outputs.udid }}"

          if command -v sim-remote >/dev/null; then
            if [ -n "$UDID" ]; then
              sim-remote reverse stop "$UDID" 8082 || true
              sim-remote reverse stop "$UDID" 8081 || true # Metro tunnel (Debug legs)
              sim-remote simctl shutdown "$UDID" || true
            fi

            sim-remote logout || true
          fi
