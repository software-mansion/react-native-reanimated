name: Remote runtime tests iOS
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  workflow_call:
    secrets:
      SIM_ROUTER_API_KEY:
        required: true
    inputs:
      bundleMode:
        required: false
        type: boolean
        default: false
      configuration:
        required: false
        type: string
        default: ReleaseRuntimeTests
      udid:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      bundleMode:
        description: Run with Bundle Mode enabled (false = Legacy Eval)
        required: false
        type: boolean
        default: false
      configuration:
        description: Build configuration (Debug* legs serve JS from Metro on the test runner)
        required: false
        type: string
        default: ReleaseRuntimeTests
      udid:
        description: Remote simulator UUID (blank = first available iPhone)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Check if we have all must-have credentials before running the workflow.
  preflight:
    if: github.repository == 'software-mansion/react-native-reanimated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY != '' }}
    steps:
      - name: Check cloud credentials are configured
        run: |
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::SIM_ROUTER_API_KEY secret is not set — configure it in the repo settings before running this workflow"
            exit 1
          fi

  # Everything happens on Argent Cloud: the app is built by its build
  # service (a macOS VM runs yarn, pods and xcodebuild — see
  # apps/fabric-example/argent-build.yaml), kept there, and installed from
  # there on one of its simulators. This runner only drives both; the app
  # never passes through it.
  runtime-tests:
    needs: preflight
    name: Remote runtime tests (${{ matrix.configuration }}, ${{ matrix.bundleMode && 'Bundle Mode' || 'Legacy Eval' }})
    runs-on: ubuntu-latest # <- no macOS anywhere in this workflow
    timeout-minutes: 120
    concurrency:
      group: runtime-tests-ios-argent-${{ github.workflow }}-${{ github.ref }}-${{ matrix.bundleMode }}-${{ matrix.configuration }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        bundleMode: ${{ fromJSON(format('[{0}]', inputs.bundleMode || false)) }}
        configuration: ${{ fromJSON(format('["{0}"]', inputs.configuration || 'ReleaseRuntimeTests')) }}
    env:
      WORKING_DIRECTORY: apps/fabric-example
      CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install monorepo node dependencies
        run: yarn install --immutable

      # Legacy Eval legs flip the checked-in Bundle Mode default off. This
      # runs here and not on the build VM because it needs git; the same
      # toggled tree is then uploaded for the build and, on Debug legs,
      # served by Metro from this runner — the native app's bundle mode and
      # the JS it loads have to match.
      - name: Toggle Bundle Mode off (Legacy Eval)
        if: ${{ !matrix.bundleMode }}
        run: yarn toggle-bundle-mode

      - name: Install sim-remote CLI
        uses: software-mansion-labs/argent-cloud-actions/install@v1

      # Log in only: a build needs no simulator machine, so none is taken
      # from the pool until the app is ready to install. The action's post
      # step logs out (releasing the machine acquired below) when the job
      # ends, even on failure or cancellation.
      - name: Log in to Argent Cloud
        uses: software-mansion-labs/argent-cloud-actions/acquire@v1
        with:
          api-key: ${{ secrets.SIM_ROUTER_API_KEY }}
          acquire: false

      - name: Keep the session alive
        run: |
          # The session idles out after 15 min without a command, and both
          # a build and a long test suite are single commands that take
          # longer than that. Kept alive for the whole job; the logout at
          # the end ends it.
          nohup sim-remote keepalive 3h > /dev/null 2>&1 &

      # The build service caches by the uploaded sources: an unchanged tree
      # resolves to the earlier build's id without a build or an upload.
      - name: Build runtime-tests app on Argent Cloud
        id: build
        shell: bash # -o pipefail: a failed build must not hand jq an empty object
        run: |
          # The whole monorepo is the archive. `--json` is the scripting
          # contract: one result object on stdout, the plan and the build
          # log on stderr.
          BUILD_ID=$(sim-remote build . \
            --config "$WORKING_DIRECTORY/argent-build.yaml" \
            --configuration "$CONFIGURATION" \
            --json | jq -re .build_id)
          echo "built $BUILD_ID (kept by the build service; fetch it with \`sim-remote builds download $BUILD_ID --out FabricExample.app.tar.gz\`)"
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Acquire a cloud machine
        run: |
          # --timeout is the queue: when all pool machines are busy (e.g.
          # sibling matrix legs hold them), this leg waits up to 30 min for
          # a free one instead of failing after the default 120 s.
          sim-remote acquire --timeout 1800
          sim-remote simctl list devices --json | jq -e '.devices' > /dev/null
          echo "machine acquired"

      - name: Pick remote simulator and install app
        id: sim
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          INPUT_UDID: ${{ inputs.udid }}
        run: |
          # Device-pick logic lives in the driver (`pick` subcommand) so it
          # is testable and reusable outside CI.
          if [ -n "$INPUT_UDID" ]; then
            UDID=$(node scripts/runtime-tests-remote.mjs pick --udid "$INPUT_UDID")
          else
            UDID=$(node scripts/runtime-tests-remote.mjs pick)
          fi

          echo "using remote simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          node scripts/runtime-tests-remote.mjs install --udid "$UDID" \
            --build-id "${{ steps.build.outputs.build-id }}"

      - name: Run ReJest self-tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          node scripts/runtime-tests-remote.mjs run --udid "${{ steps.sim.outputs.udid }}"
          --library self-tests --configuration "$CONFIGURATION"

      - name: Verify CI catches failing tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          if node scripts/runtime-tests-remote.mjs run --udid "${{ steps.sim.outputs.udid }}" \
            --library self-tests --configuration "$CONFIGURATION" \
            --only "intentional failures";
          then
            echo "A failing suite did not fail the runner" && exit 1
          else
            echo "Failing tests correctly failed the runner"
          fi

      - name: Run Worklets runtime tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          node scripts/runtime-tests-remote.mjs run --udid "${{ steps.sim.outputs.udid }}"
          --library worklets --configuration "$CONFIGURATION"

      - name: Run Reanimated runtime tests on the remote simulator
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: >
          node scripts/runtime-tests-remote.mjs run --udid "${{ steps.sim.outputs.udid }}"
          --library reanimated --configuration "$CONFIGURATION"

      # The logout itself is the login action's post step.
      - name: Shut down the remote simulator
        if: always() && steps.sim.outputs.udid != ''
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          sim-remote proxy stop "$UDID" 8082 || true
          sim-remote proxy stop "$UDID" 8081 || true # Metro tunnel (Debug legs)
          sim-remote simctl shutdown "$UDID" || true
