name: Runtime tests nightly
on:
  schedule:
    # 03:53 UTC — offset from other nightly crons to spread runner load
    - cron: '53 3 * * *'
  pull_request:
    paths:
      - .github/workflows/runtime-tests-nightly.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ios-argent:
    if: github.repository == 'software-mansion/react-native-reanimated'
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, ReleaseRuntimeTests]
        bundleMode: [false, true]
    uses: $/.github/workflows/runtime-tests-ios-argent.yml
    with:
      configuration: ${{ matrix.configuration }}
      bundleMode: ${{ matrix.bundleMode }}
      full: true
    secrets:
      SIM_ROUTER_USERNAME: ${{ secrets.SIM_ROUTER_USERNAME }}
      SIM_ROUTER_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY }}

  # Library defaults: FabricExample turns the synchronous UI prop flags on.
  ios-argent-synchronous-ui-props-off:
    if: github.repository == 'software-mansion/react-native-reanimated'
    uses: $/.github/workflows/runtime-tests-ios-argent.yml
    with:
      configuration: Debug
      bundleMode: true
      synchronousUIProps: false
      full: true
    secrets:
      SIM_ROUTER_USERNAME: ${{ secrets.SIM_ROUTER_USERNAME }}
      SIM_ROUTER_API_KEY: ${{ secrets.SIM_ROUTER_API_KEY }}

  android:
    if: github.repository == 'software-mansion/react-native-reanimated'
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, ReleaseRuntimeTests]
        bundleMode: [false, true]
    uses: $/.github/workflows/runtime-tests-android.yml
    with:
      configuration: ${{ matrix.configuration }}
      bundleMode: ${{ matrix.bundleMode }}
      full: true

  android-synchronous-ui-props-off:
    if: github.repository == 'software-mansion/react-native-reanimated'
    uses: $/.github/workflows/runtime-tests-android.yml
    with:
      configuration: Debug
      bundleMode: true
      synchronousUIProps: false
      full: true
