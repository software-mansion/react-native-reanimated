name: URL validation [Nightly]
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  pull_request:
    paths:
      - .github/workflows/url-validation-nightly.yml
      - scripts/validate-urls.js
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  url-validation-nightly:
    if: github.repository == 'software-mansion/react-native-reanimated'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Node
        id: setup-node
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version-file: '.nvmrc'

      - name: Install monorepo node dependencies
        run: yarn install

      - name: Save Yarn cache
        uses: ./.github/actions/save-yarn-cache
        with:
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          cache-primary-key: ${{ steps.setup-node.outputs.cache-primary-key }}
          cache-path: ${{ steps.setup-node.outputs.cache-path }}

      - name: Validate urls
        run: node scripts/validate-urls.js
