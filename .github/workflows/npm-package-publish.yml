name: npm package publish
on:
  workflow_call:
    inputs:
      package-name:
        description: 'Name of the package to publish - react-native-worklets or react-native-reanimated.'
        required: true
        type: string

      package-json-path:
        description: 'Path to the package.json file of the package to be published.'
        required: true
        type: string

      publish:
        description: 'Whether to publish the package or just do a dry run.'
        required: false
        type: boolean
        default: false

      version:
        description: 'Version to be published if cannot be inferred automatically, use for stable releases.'
        required: false
        type: string
        default: ''

      release-type:
        description: 'Release type to be published (stable, nightly, beta, rc)'
        type: string
        required: true

      npm-tag:
        description: 'npm tag to publish under (usually inferred from release type and version)'
        required: false
        type: string
        default: ''

      runs-on:
        description: 'Runner for the publish job.'
        required: false
        type: string
        default: 'ubuntu-latest'

      artifacts-pattern:
        description: 'Glob of workflow artifacts to download before building, empty to skip.'
        required: false
        type: string
        default: ''

      artifacts-path:
        description: 'Directory the artifacts matching artifacts-pattern are merged into.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    steps:
      # The nightly version holds the UTC date of the moment it is resolved,
      # so a run that crosses midnight and the next run on the same commit
      # resolve the same version, and npm refuses the second publish. A run
      # with an explicit npm tag still publishes, so that the tag is updated.
      - name: Check for a published nightly of this commit
        id: published-nightly
        if: inputs.release-type == 'nightly' && inputs.publish && inputs.npm-tag == ''
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          short_sha="${GITHUB_SHA::9}"
          # A separate command, so that a failed lookup fails the step
          # instead of reading as an unpublished commit.
          versions=$(npm view "$PACKAGE_NAME" versions --json)
          if grep -q -- "-nightly-[0-9]*-${short_sha}\"" <<< "$versions"; then
            echo "::notice::$PACKAGE_NAME already has a nightly of $short_sha, skipping the publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.published-nightly.outputs.exists != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node.js
        if: steps.published-nightly.outputs.exists != 'true'
        id: setup-node
        uses: $/.github/actions/setup-node-yarn
        with:
          node-version-file: '.nvmrc'

      - name: Download prebuilt artifacts
        if: steps.published-nightly.outputs.exists != 'true' && inputs.artifacts-pattern != ''
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          pattern: ${{ inputs.artifacts-pattern }}
          path: ${{ inputs.artifacts-path }}
          merge-multiple: true

      - name: Build and publish ${{ inputs.package-name }}
        if: steps.published-nightly.outputs.exists != 'true'
        uses: software-mansion/npm-package-publish@bbfbcdf3f27e2dc288d7d56f5989a731efc79e6f
        with:
          package-name: ${{ inputs.package-name }}
          package-json-path: ${{ inputs.package-json-path }}
          release-type: ${{ inputs.release-type || 'nightly' }}
          version: ${{ inputs.version }}
          npm-tag: ${{ inputs.npm-tag }}
          dry-run: ${{ !inputs.publish }}
          version-getter-script: 'scripts/resolve-release-version.js'
          perform-git-operations: 'false'
