name: Benchmark manual
on:
  workflow_dispatch:
    inputs:
      platform:
        description: The platform of the phone
        required: true
        type: choice
        options:
          - android
          - ios
      phone:
        description: The runner label that names the cabled phone model
        required: true
        type: string
      a-reanimated:
        description: An exact Reanimated version for A, or checkout (the commit of the branch that you run the workflow on)
        required: true
        type: string
      a-worklets:
        description: An exact Worklets version for A, or checkout. Empty takes the version from compatibility.json, or checkout when A is checkout.
        required: false
        type: string
        default: ''
      b-reanimated:
        description: An exact Reanimated version for B, or checkout (the commit of the branch that you run the workflow on)
        required: true
        type: string
        default: checkout
      b-worklets:
        description: An exact Worklets version for B, or checkout. Empty takes the version from compatibility.json, or checkout when B is checkout.
        required: false
        type: string
        default: ''
      scenarios:
        description: Scenario names separated by commas, or all (all scenarios that need no static flag that the config does not set)
        required: false
        type: string
        default: all
      shared-element-transitions:
        description: Set ENABLE_SHARED_ELEMENT_TRANSITIONS to true in A and B. Then all includes shared-elements.
        required: false
        type: boolean
        default: false
      blocks:
        description: The number of blocks for each scenario
        required: false
        type: number
        default: 5
      noise-limits:
        description: The name of a noise limits record on the runner. Empty gives an uncalibrated run.
        required: false
        type: string
        default: ''
      without-validation-record:
        description: iOS only. Run without the validation record of the runner, for the first A/A calibration of a phone. The run then gives no CPU verdict.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    if: github.repository == 'software-mansion/react-native-reanimated'
    uses: $/.github/workflows/benchmark-run.yml
    with:
      platform: ${{ inputs.platform }}
      phone: ${{ inputs.phone }}
      a-reanimated: ${{ inputs.a-reanimated }}
      a-worklets: ${{ inputs.a-worklets }}
      b-reanimated: ${{ inputs.b-reanimated }}
      b-worklets: ${{ inputs.b-worklets }}
      scenarios: ${{ inputs.scenarios }}
      shared-element-transitions: ${{ inputs.shared-element-transitions }}
      blocks: ${{ inputs.blocks }}
      noise-limits: ${{ inputs.noise-limits }}
      without-validation-record: ${{ inputs.without-validation-record }}
