name: Worklets plugin static check
env:
  YARN_ENABLE_HARDENED_MODE: 0
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worklets-plugin-static-check:
    if: github.repository == 'software-mansion/react-native-reanimated'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle_output: /dev/null
            plugin: babel
          - os: windows-latest
            bundle_output: 'NUL'
            plugin: babel
          - os: ubuntu-latest
            bundle_output: /dev/null
            plugin: oxc
    runs-on: ${{ matrix.os }}
    concurrency:
      group: worklets-plugin-static-check-${{ matrix.os }}-${{ matrix.plugin }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      EXAMPLE_DIR: apps/fabric-example
      WORKLETS_DIR: packages/react-native-worklets
      PLUGIN_DIR: packages/react-native-worklets/plugin
      OXC_PLUGIN_DIR: packages/react-native-worklets/plugin-oxc
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: 'yarn'
      - name: Clear annotations
        shell: bash
        run: .github/workflows/helper/clear-annotations.sh

      - name: Install monorepo dependencies
        run: yarn install --immutable
      - name: Build Worklets
        if: matrix.os != 'windows-latest'
        working-directory: ${{ env.WORKLETS_DIR }}
        run: yarn build

      - name: Diff
        id: diff
        if: matrix.os != 'windows-latest'
        run: git update-index --refresh && git diff-index --quiet HEAD --
      - name: Show diff
        if: failure() && steps.diff.outcome == 'failure'
        run: git diff
      - name: Check types
        if: matrix.os != 'windows-latest'
        working-directory: ${{ env.PLUGIN_DIR }}
        run: yarn type:check
      - name: Lint and format
        if: matrix.os != 'windows-latest'
        working-directory: ${{ env.PLUGIN_DIR }}
        run: yarn lint

      - name: Unit tests
        working-directory: ${{ env.PLUGIN_DIR }}
        run: yarn test

      - name: Cache Cargo
        if: matrix.plugin == 'oxc'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.OXC_PLUGIN_DIR }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/react-native-worklets/plugin-oxc/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: OXC plugin own tests
        if: matrix.plugin == 'oxc'
        working-directory: ${{ env.OXC_PLUGIN_DIR }}
        run: yarn test:oxc
      - name: Babel plugin test suite against the OXC plugin
        if: matrix.plugin == 'oxc'
        working-directory: ${{ env.OXC_PLUGIN_DIR }}
        run: yarn test:babel-suite
      - name: Build OXC plugin
        if: matrix.plugin == 'oxc'
        working-directory: ${{ env.OXC_PLUGIN_DIR }}
        run: yarn build

      - name: Check Example App bundling
        shell: bash
        working-directory: ${{ env.EXAMPLE_DIR }}
        env:
          WORKLETS_PLUGIN: ${{ matrix.plugin }}
        run:
          yarn react-native bundle --reset-cache --entry-file='App.tsx' --bundle-output='${{ matrix.bundle_output }}'
          --dev=true --platform=android

      - name: Disable Bundle Mode
        if: matrix.plugin != 'oxc'
        shell: bash
        run: yarn toggle-bundle-mode
      - name: Check Example App bundling (Eval Mode)
        if: matrix.plugin != 'oxc'
        shell: bash
        working-directory: ${{ env.EXAMPLE_DIR }}
        env:
          WORKLETS_PLUGIN: babel
        run:
          yarn react-native bundle --reset-cache --entry-file='App.tsx' --bundle-output='${{ matrix.bundle_output }}'
          --dev=true --platform=android
