name: Save Ccache
description: Report ccache statistics and persist the cache from the default branch

inputs:
  key-prefix:
    description: Cache key prefix, must match the one passed to setup-ccache
    required: true

runs:
  using: 'composite'
  steps:
    - name: Report ccache statistics
      shell: bash
      run: ccache --show-stats -v

    - name: Save ccache
      if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/Library/Caches/ccache
        key: ccache-${{ inputs.key-prefix }}-${{ github.sha }}

    # Restores match by prefix and take the newest entry, so every older
    # entry under the same prefix is dead weight against the 10 GB budget.
    - name: Delete superseded ccache entries
      if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        KEY_PREFIX: ccache-${{ inputs.key-prefix }}-
        CURRENT_KEY: ccache-${{ inputs.key-prefix }}-${{ github.sha }}
      run: |
        gh api --paginate "repos/${REPO}/actions/caches?key=${KEY_PREFIX}&ref=refs/heads/main&per_page=100" \
          --jq ".actions_caches[] | select(.key != \"${CURRENT_KEY}\") | .id" |
        while read -r id; do
          echo "Deleting cache ${id}"
          gh api -X DELETE "repos/${REPO}/actions/caches/${id}"
        done
