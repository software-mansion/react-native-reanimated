name: Install Pods
description: Restore the Pods cache and install CocoaPods dependencies

inputs:
  working-directory:
    description: The app directory (e.g., apps/fabric-example)
    required: true
  pod-directory:
    description: The pod directory relative to working-directory (e.g., ios, macos)
    required: true

outputs:
  cache-hit:
    description: Whether the restore was an exact primary-key hit
    value: ${{ steps.pods-cache.outputs.cache-hit }}
  cache-primary-key:
    description: >-
      The primary key computed at restore time, before `pod update` rewrites
      Podfile.lock. Pass it to save-pods so the entry is saved under the key
      later runs will actually look up.
    value: ${{ steps.pods-cache.outputs.cache-primary-key }}

runs:
  using: 'composite'
  steps:
    # The key covers only what drives dependency resolution; `pod update`
    # reconciles native sources from any restored tree. yarn.lock stays out:
    # `yarn toggle-bundle-mode` rewrites it on the Legacy Eval legs, which
    # would give them a key no saver ever writes.
    - name: Restore Pods cache
      id: pods-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ${{ inputs.working-directory }}/${{ inputs.pod-directory }}/Pods
          ~/Library/Caches/CocoaPods
        key:
          pods-${{ inputs.working-directory }}-${{ inputs.pod-directory }}-${{ hashFiles(
          format('{0}/{1}/Podfile.lock', inputs['working-directory'], inputs['pod-directory']),
          format('{0}/{1}/Podfile', inputs['working-directory'], inputs['pod-directory']),
          'packages/react-native-reanimated/RNReanimated.podspec',
          'packages/react-native-reanimated/scripts/reanimated_utils.rb',
          'packages/react-native-worklets/RNWorklets.podspec',
          'packages/react-native-worklets/scripts/worklets_utils.rb',
          'scripts/llvm-tools/add-xcode-step.rb'
          ) }}
        restore-keys: |
          pods-${{ inputs.working-directory }}-${{ inputs.pod-directory }}-

    - name: Install Pods
      shell: bash
      working-directory: ${{ inputs.working-directory }}/${{ inputs.pod-directory }}
      run: |
        bundle install
        bundle exec pod update --no-repo-update
